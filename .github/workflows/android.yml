name: Build and test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the publish steps push outputs to ci-* branches

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint, APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, debug APK, release AAB
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug assembleDebug bundleRelease
      - name: Verification server tests
        working-directory: server
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Publish outputs to the ci-build-outputs branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp app/build/outputs/apk/debug/*.apk /tmp/pub/ || true
          cp app/build/outputs/bundle/release/*.aab /tmp/pub/ || true
          mkdir -p /tmp/pub/reports && cp -r app/build/reports/* /tmp/pub/reports/ || true
          mkdir -p /tmp/pub/test-results && cp -r app/build/test-results/* /tmp/pub/test-results/ || true
          cd /tmp/pub
          git init -q -b ci-build-outputs
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Outputs for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:ci-build-outputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-outputs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn

  emulator:
    name: Emulator UI tests, screenshots, demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and test APKs
        run: ./gradlew --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on Pixel 6 emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/emulator-run.sh
      - name: Publish outputs to the ci-emulator-outputs branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp -r ci-output/* /tmp/pub/ || true
          cd /tmp/pub
          git init -q -b ci-emulator-outputs
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Outputs for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:ci-emulator-outputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-outputs
          path: ci-output/
          if-no-files-found: warn
